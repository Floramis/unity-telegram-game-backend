<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Unity WebGL Player | Floramis Jumping Juniper</title>
  <meta name="viewport"
    content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
  <style>
    body {
      text-align: center;
      padding: 0;
      border: 0;
      margin: 0;
      background: #121212;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    #loading-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #121212;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    #loading-text {
      font-size: 20px;
      margin-bottom: 15px;
      animation: fadein 1.5s infinite alternate;
    }

    .spinner {
      border: 6px solid rgba(255, 255, 255, 0.2);
      border-top: 6px solid white;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin-bottom: 15px;
    }

    #progress-container {
      width: 150px;
      height: 10px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 5px;
      overflow: hidden;
      display: none;
      /* Show when progress updates */
    }

    #progress-bar {
      width: 0%;
      height: 100%;
      background: white;
      transition: width 0.2s;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes fadein {
      0% {
        opacity: 0.5;
      }

      100% {
        opacity: 1;
      }
    }

    canvas {
      display: none;
      /* Hide Unity canvas until game loads */
    }
  </style>
</head>

<body>
  <div id="loading-screen">
    <div class="spinner"></div>
    <p id="loading-text">Loading...</p>
    <div id="progress-container">
      <div id="progress-bar"></div>
    </div>
  </div>

  <canvas id="unity-canvas" width=720 height=1280 style="width: 720px; height: 1280px; background: #231F20"></canvas>
  <script src="Build/Builds.loader.js"></script>
  <script>
    function adjustCanvasSize() {
      var canvas = document.querySelector("#unity-canvas");

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile settings: fill the whole screen
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);

        canvas.style.width = "100%";
        canvas.style.height = "100%";
        canvas.style.position = "fixed";

        document.body.style.textAlign = "left";
      } else {
        // Desktop settings: Scale proportionally to fit window
        let aspectRatio = 720 / 1280;     // Target aspect ratio

        let windowWidth = window.innerWidth;
        let windowHeight = window.innerHeight;

        let newWidth = windowWidth;
        let newHeight = windowWidth / aspectRatio;

        if (newHeight > windowHeight) {
          newHeight = windowHeight;
          newWidth = windowHeight * aspectRatio;
        }

        canvas.style.width = newWidth + "px";
        canvas.style.height = newHeight + "px";
        canvas.style.margin = "auto";
        canvas.style.display = "block";
      }
    }

    window.addEventListener("resize", adjustCanvasSize);
    window.addEventListener("load", adjustCanvasSize);

    createUnityInstance(document.querySelector("#unity-canvas"), {
      dataUrl: "Build/Builds.data.unityweb",
      frameworkUrl: "Build/Builds.framework.js.unityweb",
      codeUrl: "Build/Builds.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Floramis",
      productName: "Floramis",
      productVersion: "0.4.6",
      onProgress: function (instance, progress) {
        document.getElementById("progress-container").style.display = "block"; // Show progress bar
        document.getElementById("progress-bar").style.width = (progress * 100) + "%";
      }
    }).then(() => {
      document.getElementById("loading-screen").style.display = "none"; // Hide loading screen
      document.getElementById("unity-canvas").style.display = "block"; // Show game
    });
  </script>
</body>

</html>
