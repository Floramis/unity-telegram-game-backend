<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Unity WebGL Player | Floramis</title>
</head>

<body style="text-align: center; padding: 0; border: 0; margin: 0;">
  <canvas id="unity-canvas" width=720 height=1280 style="width: 720px; height: 1280px; background: #231F20"></canvas>
  <script src="Build/Builds.loader.js"></script>
  <script>
    function adjustCanvasSize() {
      var canvas = document.querySelector("#unity-canvas");

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile settings: fill the whole screen
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);

        canvas.style.width = "100%";
        canvas.style.height = "100%";
        canvas.style.position = "fixed";

        document.body.style.textAlign = "left";
      } else {
        // Desktop settings: Scale proportionally to fit window
        let aspectRatio = 720 / 1280;   // Target aspect ratio

        let windowWidth = window.innerWidth;
        let windowHeight = window.innerHeight;

        let newWidth = windowWidth;
        let newHeight = windowWidth / aspectRatio;

        if (newHeight > windowHeight) {
          newHeight = windowHeight;
          newWidth = windowHeight * aspectRatio;
        }

        canvas.style.width = newWidth + "px";
        canvas.style.height = newHeight + "px";
        canvas.style.margin = "auto";
        canvas.style.display = "block";
      }
    }

    window.addEventListener("resize", adjustCanvasSize);
    window.addEventListener("load", adjustCanvasSize);

    createUnityInstance(document.querySelector("#unity-canvas"), {
      dataUrl: "Build/Builds.data",
      frameworkUrl: "Build/Builds.framework.js",
      codeUrl: "Build/Builds.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Floramis",
      productName: "Floramis",
      productVersion: "0.4.6",
    });
  </script>
</body>

</html>
